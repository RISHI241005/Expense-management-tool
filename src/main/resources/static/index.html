<!DOCTYPE html>
<html>
<head>
    <title>Expense Manager</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

<div class="container mt-4">

    <h2 class="text-center mb-4">Expense Management System</h2>

    <!-- FORM -->
    <div class="card mb-4">
        <div class="card-body">
            <form id="expenseForm" class="row g-3">
                <input type="hidden" id="expenseId">

                <div class="col-md-3">
                    <input type="text" id="title" class="form-control" placeholder="Title" required>
                </div>

                <div class="col-md-2">
                    <input type="number" id="amount" class="form-control" placeholder="Amount" required>
                </div>

                <div class="col-md-3">
                    <input type="text" id="category" class="form-control" placeholder="Category" required>
                </div>

                <div class="col-md-2">
                    <input type="date" id="expenseDate" class="form-control" required>
                </div>

                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100">
                        Save
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- TABLE -->
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>Title</th>
            <th>Amount</th>
            <th>Category</th>
            <th>Date</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody id="expenseTableBody"></tbody>
    </table>

</div>

<script src="script.js"></script>
</body>

</html>
